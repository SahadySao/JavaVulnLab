<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<!-- h:outputText échappe par défaut, et #{...} dans le texte aussi : sûr -->
<h:body>
  <h:form><h:inputText value="#{noteBean.note}"/></h:form>
  <h:outputText value="#{noteBean.note}"/>
  <p>Note : #{noteBean.note}</p>
</h:body>
</html>
