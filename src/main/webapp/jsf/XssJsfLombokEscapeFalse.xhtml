<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets">
<!-- Bean Lombok (@Getter @Setter) : la saisie est réaffichée avec escape="false" -->
<h:body>
  <h:form>
    <h:inputTextarea value="#{lombokCommentBean.comment}"/>
    <h:commandButton value="Envoyer" action="#{lombokCommentBean.save}"/>
  </h:form>
  <h:outputText value="#{lombokCommentBean.comment}" escape="false"/>
</h:body>
</html>
