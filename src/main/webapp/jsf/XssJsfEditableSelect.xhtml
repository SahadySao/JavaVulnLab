<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<!-- Liste ÉDITABLE : l'utilisateur peut saisir une valeur libre -->
<h:body>
  <h:form>
    <p:selectOneMenu value="#{countryBean.country}" editable="true">
      <f:selectItem itemValue="France"/>
    </p:selectOneMenu>
  </h:form>
  <h:outputText value="#{countryBean.country}" escape="false"/>
</h:body>
</html>
